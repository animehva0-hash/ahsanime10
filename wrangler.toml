name = "ahsanimepro"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BATCH_SIZE = "120"
CONCURRENCY = "5"
MAX_RETRIES = "3"
RETRY_DELAY = "3000"
MODEL_NAME = "gemini-3.5-flash-lite"
GEMINI_TRANSLATE_MODEL = "gemini-3.5-flash-lite"