; AHSANIME (PHP) — per-directory PHP settings for free/shared hosts
; (InfinityFree, 000webhost, FreeHostia, …). Free plans cap PHP memory
; around 64MB and CPU time around 60s per 10 minutes, so we stay under
; those ceilings instead of OOM-killing the worker mid-stream.

memory_limit = 128M
max_execution_time = 30
max_input_time = 30
upload_max_filesize = 16M
post_max_size = 32M
output_handler = ""